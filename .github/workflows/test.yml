name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: DrivnX/drivnx-cli
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: drivnx install (clones, team posts, daily job, PATH link)
        run: python DrivnX/drivnx-cli/drivnx install --skip-deps --skip-mcp
      - name: Check what install set up
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          from pathlib import Path
          home, ws = Path.home(), Path("DrivnX").resolve()
          checks = {
              "repos cloned": all((ws / r / ".git").exists() for r in ("drivnx-docs", "drivnx-web", "drivnx-landing")),
              "notifier copied": (home / ".claude/hooks/pumble-notify.py").is_file(),
              "hooks wired": all("pumble-notify.py" in json.dumps(json.loads((home / ".claude/settings.json").read_text())["hooks"][e])
                                 for e in ("UserPromptSubmit", "Stop")),
              "settings written": (home / ".config/drivnx/pumble.json").is_file(),
              "drivnx command": (home / ".local/bin" / ("drivnx.cmd" if os.name == "nt" else "drivnx")).exists(),
              "daily job": (subprocess.run(["schtasks", "/Query", "/TN", "DrivnX daily report"]).returncode == 0
                            if os.name == "nt" else sum("pumble-notify.py" in l and "digest" in l for l in subprocess.run(
                                ["crontab", "-l"], capture_output=True, text=True).stdout.splitlines()) == 1),
          }
          for name, good in checks.items():
              print(("PASS " if good else "FAIL ") + name)
          sys.exit(0 if all(checks.values()) else 1)
          EOF
      - name: Re-running install is safe
        run: |
          python DrivnX/drivnx-cli/drivnx install --skip-deps --skip-mcp > /dev/null
          python -c "import json,pathlib; h=json.loads((pathlib.Path.home()/'.claude/settings.json').read_text())['hooks']; assert all(len(h[e])==1 for e in h), h; print('PASS no duplicate hooks')"
          if [ "$RUNNER_OS" != "Windows" ]; then
            n=$(crontab -l | grep -c 'pumble-notify.py.*digest'); [ "$n" = 1 ] || { echo "FAIL $n cron lines"; exit 1; }
            echo "PASS one cron line"
          fi
      - name: drivnx status and report
        run: |
          python DrivnX/drivnx-cli/drivnx status
          python DrivnX/drivnx-cli/drivnx report
      - name: Notifier posts nothing for a turn without changes, and logs a turn with a commit
        run: |
          set -eu
          n="$HOME/.claude/hooks/pumble-notify.py"
          cd DrivnX/drivnx-web
          dir=$(pwd -W 2>/dev/null || pwd)   # a Windows path on Windows, so Python and git understand it
          git config user.email ci@example.com && git config user.name CI
          hook() { echo "{\"session_id\":\"ci\",\"cwd\":\"$dir\",\"last_assistant_message\":\"Did the thing.\"}" | PUMBLE_NOTIFY_DRY_RUN=1 python "$n" "$1"; }
          hook start
          out=$(hook stop)
          [ -z "$out" ] || { echo "FAIL posted without changes: $out"; exit 1; }
          echo "PASS silent without changes"
          hook start
          git commit -q --allow-empty -m "CI test commit"
          echo x > ci.txt
          out=$(hook stop)
          echo "$out"
          echo "$out" | grep -q "CI test commit" || { echo "FAIL commit not in the post"; exit 1; }
          echo "PASS posts the commit"
